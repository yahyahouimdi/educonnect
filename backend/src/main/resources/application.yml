# EduConnect backend configuration.
# Every value can be overridden with an environment variable (see .env.example at the repo root).

spring:
  application:
    name: educonnect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/educonnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:educonnect}
    password: ${DB_PASSWORD:educonnect}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-this-is-a-development-only-secret-of-at-least-64-characters!!}
    jwt-expiration: ${JWT_EXPIRATION:PT12H}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@educonnect.local}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    admin-name: ${ADMIN_NAME:Platform Administrator}
    demo-data: ${DEMO_DATA:true}
  institution:
    name: ${INSTITUTION_NAME:EduConnect Academy}
    short-name: ${INSTITUTION_SHORT_NAME:EduConnect}
    tagline: ${INSTITUTION_TAGLINE:Learn. Connect. Grow.}
    email: ${INSTITUTION_EMAIL:contact@educonnect.local}
    phone: ${INSTITUTION_PHONE:+000 00 000 000}
    address: ${INSTITUTION_ADDRESS:1 Campus Avenue, Your City}
    primary-color: ${INSTITUTION_PRIMARY_COLOR:#1d4ed8}
  storage:
    location: ${STORAGE_LOCATION:./data/uploads}
  assistant:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-2.5-flash}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    system-prompt: ${AI_SYSTEM_PROMPT:You are a friendly teaching assistant for an educational institution. Answer clearly and concisely, and help students understand concepts rather than just giving answers.}
