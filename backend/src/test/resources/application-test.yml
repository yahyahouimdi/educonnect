spring:
  datasource:
    url: jdbc:h2:mem:educonnect;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # The Flyway schema targets MySQL column types; H2 reports some of them differently.
      ddl-auto: none

app:
  storage:
    location: ${java.io.tmpdir}/educonnect-test-uploads
  bootstrap:
    demo-data: true
